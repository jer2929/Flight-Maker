# Personal Flight Decision Card - encoded limits (Jeremy / CYFD)
# Edit these to tune the tool. All winds in knots, visibility in statute miles,
# ceilings in feet AGL. Cross-country (XC) values are used for destination flights.

hard_limits:
  wind:
    sustained_max_kt: 20
    gust_spread_max_kt: 10      # gust minus steady
    # Below this peak gust the spread is reported but does not gate.
    #
    # The spread limit is written for a METAR's G: a peak within the last ten
    # minutes against a two-minute mean. A model has no such pairing - Open-Meteo
    # gives an instantaneous hourly wind and a gust that is the maximum over the
    # preceding hour - so subtracting them yields a systematically larger number
    # than the one this limit was set against. And the two ends of the scale are
    # not the same flight: a 10 kt spread on a 2 kt wind is a 12 kt peak, which
    # is nothing; the same spread on an 18 kt wind is a 28 kt peak, which is the
    # day the limit exists for. Set to 0 to gate on spread alone.
    #
    # Tuned HERE and nowhere else. There is deliberately no slider for it and
    # the API will not accept it from a saved profile (see config._NUMERIC_LIMITS):
    # it is not a personal limit, it is the correction that makes the spread
    # limit above mean the same thing against a model as against a METAR's G.
    gust_spread_floor_kt: 15    # peak gust below which spread is advisory only
    crosswind_max_kt: 9
  ceiling_agl_ft:               # VFR personal minimums
    day_circuit: 2000
    day_xc: 4000
    night_circuit: 3000
    night_xc_cloud_base: 12000
  visibility_sm:                # VFR personal minimums
    day_circuit: 5
    day_xc: 9
    night_circuit: 6
    night_xc: 9
  weather_flags:                # any present in METAR/TAF -> NO-GO
    - convective_sigmet
    - thunderstorm            # TS
    - embedded_thunderstorm   # EMBD TS/CB, CVCTV CLD EMBD - gates IFR too
    - freezing_rain           # FZRA
    - forecast_icing
    - moderate_turbulence_low # below 3000 ft
    - low_level_wind_shear    # LLWS / WS
    - widespread_ifr
  # ADVISORY ONLY - this one never gates a verdict, unlike everything above it.
  # Density altitude this far above aerodrome elevation gets an amber row telling
  # you to open the performance chart; it is never a NO-GO, because the go/no-go
  # on a density altitude belongs to whoever has the aircraft's numbers in front
  # of them. NAV CANADA broadcasts DA on ATIS/AWOS at 200 ft AAE; 500 is the more
  # conservative default here. Computed from an observed METAR for a departure
  # now, and from the model forecast for a departure later; the row names which.
  density_altitude:
    advisory_above_field_ft: 500
  # ADVISORY ONLY - like density_altitude above, this never gates anything.
  # How much better a later departure has to be before the card bothers to
  # mention it. These are the "is it worth waiting?" thresholds, and they exist
  # so the suggestion stays rare: an advisory that fires on every flight is one
  # every pilot learns to scroll past. A suggestion is only made when the later
  # hour is no worse on every other axis - see services/etd_options.py.
  wait_advisory:
    max_wait_hr: 12             # beyond this it isn't waiting, it's another day
    tailwind_gain_kt: 10        # knots of route wind component gained at cruise
    ceiling_gain_ft: 1500       # feet of extra ceiling
    crosswind_drop_kt: 5        # knots off the crosswind on the best runway
  recent_experience:
    min_hours_last_30_days: 5
  fuel_reserve_hr:
    vfr: 1.0
    ifr: 1.5

# IFR personal minimums - used when flight_rules=ifr is selected.
# These are separate from hard_limits so VFR profile sliders are unaffected.
ifr_minimums:
  ceiling_agl_ft:
    day_xc: 1500         # flat personal ceiling floor (confirm it's >= published DA/MDA)
    night_xc: 1500
  visibility_sm:
    day_xc: 3            # flat personal visibility floor (confirm it meets published minimum)
    night_xc: 3
  # When true, Hard IMC counts as a stacking threat on IFR flights (for pilots
  # who'd rather not be in sustained IMC - e.g. single-engine or no autopilot).
  # When false (default) IFR flights aren't penalised for it and the row is not
  # shown at all.
  #
  # Hard IMC means cloud that is LOW or cloud that is DEEP: a ceiling under
  # 1,000 ft AGL, visibility under 3 SM, or a deck at least
  # ``hard_imc_thickness_ft`` thick whatever height its base sits at.
  hard_imc_as_threat: false
  # How deep a deck has to be to count as Hard IMC on its own. An overcast from
  # 3,000 to 12,000 ft leaves the ceiling test untouched at 3,000 ft while putting
  # the aeroplane inside cloud for the whole climb and the whole descent.
  hard_imc_thickness_ft: 5000

# TWO-TRIGGER THREAT STACKING
# A weighted count of major threats present -> rule. The active conservatism
# preset (below) supplies both the per-threat weights and this rule; the values
# here are the built-in default ("standard").
threat_stacking:
  # Whether a night flight carries "night operations" into the threat stack.
  # Pilots differ on this - for some, night is the single biggest risk multiplier;
  # for others, a current night-rated pilot over familiar terrain in stable VMC is
  # just a normal flight. On by default, which is the original decision card.
  # Independent of the day/night toggle itself: night always selects your night
  # ceiling and visibility minimums, whatever this is set to.
  night_as_threat: true
  # Wind that is *within* your limits can still be worth a mitigation, so the
  # automatic "strong or gusty winds" threat trips below the hard limit. These
  # are fractions of YOUR wind limits, not fixed knots: raise a limit and the
  # trigger moves with it. They used to be hardcoded 15 kt and 8 kt, which are
  # exactly these fractions of the default 20 kt / 10 kt - so the default
  # profile behaves identically - but a pilot who set a 20 kt gust spread still
  # got flagged at 8 kt, with a card that said "within personal limits" and
  # MITIGATE at the same time.
  auto_threat_fraction:
    sustained: 0.75      # 15 kt against the default 20 kt sustained limit
    gust_spread: 0.8     # 8 kt against the default 10 kt gust-spread limit
  major_threats:
    - night_operations
    - hard_imc
    - icing_potential
    - convective_nearby
    - strong_or_gusty_winds
    - moderate_turbulence_or_shear
    - terrain_critical
    - single_pilot_ifr_no_autopilot
    - unfamiliar_or_complex_airspace
  rule:
    "0": GO
    "1": MITIGATE
    "2": NO-GO        # no-go solo
    "3": NO-GO
  # How each threat is sourced, for the UI:
  #   auto       - derived automatically from the forecast each hour
  #   mode       - set automatically by the day/night toggle
  #   standing   - a pilot/aircraft factor saved in the profile, applied every flight
  #   per_flight - toggled per flight (pilot-relative)
  threat_kinds:
    night_operations: mode
    hard_imc: auto
    icing_potential: auto
    convective_nearby: auto
    strong_or_gusty_winds: auto
    moderate_turbulence_or_shear: auto
    terrain_critical: per_flight
    single_pilot_ifr_no_autopilot: per_flight
    unfamiliar_or_complex_airspace: per_flight

# CONSERVATISM PRESETS - how readily stacked threats escalate the verdict.
# Each preset supplies per-threat `weights` (default 1) and the count->verdict
# `rule`. The pilot picks one in their profile; "standard" preserves the
# original decision card and is the default.
conservatism_presets:
  default: standard
  presets:
    cautious:
      label: Cautious
      description: Stops you sooner - one serious threat can be a no-go.
      serious_weight: 2          # hard_imc / convective / icing count double
      rule: {"0": GO, "1": MITIGATE, "2": NO-GO, "3": NO-GO}
    standard:
      label: Standard
      description: The recommended balance for most pilots.
      rule: {"0": GO, "1": MITIGATE, "2": NO-GO, "3": NO-GO}
    confident:
      label: Confident
      description: More tolerant - it takes more stacked threats to stop you.
      rule: {"0": GO, "1": GO, "2": MITIGATE, "3": NO-GO}
  # Threats treated as "serious" (double-weighted under the cautious preset).
  serious_threats:
    - hard_imc
    - convective_nearby
    - icing_potential


# Thresholds used to derive threats/scoring from forecast model data (outlook)
outlook:
  good_max_wind_kt: 12
  marginal_max_wind_kt: 18
  good_max_crosswind_kt: 7
  good_max_cloud_pct: 50
  good_max_precip_mm: 0.2
  marginal_max_precip_mm: 2.0
  cape_convective: 300        # J/kg suggesting convective potential
  pressure_falling_hpa_per_6h: -1.5   # steeper fall than this = low approaching
  pressure_rising_hpa_per_6h: 1.0     # rise above this = high building
