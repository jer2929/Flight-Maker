# Continuous deploy: every push to main builds and ships to Fly.io.
# Merging a PR into main = deploying. No manual step.
#
# Requires one repo secret: FLY_API_TOKEN
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Create the token in the browser at https://fly.io/user/personal_access_tokens
#   (or with `fly tokens create deploy -x 999999h` if you have flyctl). See DEPLOY.md.
#
# The "create app" step below means the very first deploy needs no local flyctl:
# this workflow provisions the Fly app itself, then deploys to it.
name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you re-run a deploy by hand from the Actions tab

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group   # never run two deploys at once
    steps:
      - uses: actions/checkout@v4

      # Nothing used to stand between a push to main and production. A single
      # undefined name - a local deleted while a closure still read it - shipped
      # a 500 on every route assessment, and the first thing that noticed was a
      # pilot looking at the app. These two steps run before anything touches
      # Fly, so a red main fails the job instead of deploying.
      #
      # app/ is what the container runs, so it is the part that must be clean.
      # scripts/ and tests/ are linted too: they are not shipped, but an unused
      # import or a dead local there is the same signal that something was
      # removed and its scaffolding left behind - and a probe script that has
      # rotted is one nobody can use on the day they need it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # matches the Dockerfile's base image
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (undefined names, dead imports)
        run: python -m pyflakes app/ scripts/ tests/

      # test_live_smoke.py auto-skips when the network is unavailable, so it
      # runs here and nowhere else - pointing eleven tests at the real NAV
      # CANADA and Open-Meteo endpoints. That is a useful thing to run; it is
      # the wrong thing to gate a deploy on, because it makes shipping a fix
      # depend on a weather service being up. Run it deliberately instead:
      # `python -m pytest tests/test_live_smoke.py` where the network is open.
      - name: Tests
        run: python -m pytest tests/ -q --ignore=tests/test_live_smoke.py

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create the Fly app if it doesn't exist yet
        run: |
          APP=$(sed -n 's/^app *= *"\(.*\)"/\1/p' fly.toml | head -1)
          echo "Fly app: $APP"
          if flyctl apps list | grep -qw "$APP"; then
            echo "App already exists - skipping creation."
          elif flyctl apps create "$APP" --org personal; then
            echo "Created app $APP."
          else
            echo "::error::Could not create Fly app '$APP'. The name may already be"
            echo "::error::taken by someone else on Fly (names are global). Pick a new"
            echo "::error::name in fly.toml and push again."
            exit 1
          fi

      - name: Deploy
        run: flyctl deploy --remote-only

      # flyctl provisions 2 machines by default for high availability. This is a
      # personal-scale app on a tight budget, and both machines bill per second
      # while awake, so pin the count to 1. Idempotent - a no-op once it's 1.
      - name: Pin to a single machine (cost control)
        run: flyctl scale count 1 --yes
