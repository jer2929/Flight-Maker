# Continuous deploy: every push to main builds and ships to Fly.io.
# Merging a PR into main = deploying. No manual step.
#
# Requires one repo secret: FLY_API_TOKEN
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Create the token in the browser at https://fly.io/user/personal_access_tokens
#   (or with `fly tokens create deploy -x 999999h` if you have flyctl). See DEPLOY.md.
#
# The "create app" step below means the very first deploy needs no local flyctl:
# this workflow provisions the Fly app itself, then deploys to it.
name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you re-run a deploy by hand from the Actions tab

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  # Nothing used to stand between a push to main and production. The gate lives
  # in checks.yml and is called - not copied - so the deploy and every pull
  # request are held to the same rules. A copy here is how a branch cut before
  # the rules changed came to pass its own stale gate and redden main.
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    needs: checks               # a red main fails the job instead of deploying
    concurrency: deploy-group   # never run two deploys at once
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create the Fly app if it doesn't exist yet
        run: |
          APP=$(sed -n 's/^app *= *"\(.*\)"/\1/p' fly.toml | head -1)
          echo "Fly app: $APP"
          if flyctl apps list | grep -qw "$APP"; then
            echo "App already exists - skipping creation."
          elif flyctl apps create "$APP" --org personal; then
            echo "Created app $APP."
          else
            echo "::error::Could not create Fly app '$APP'. The name may already be"
            echo "::error::taken by someone else on Fly (names are global). Pick a new"
            echo "::error::name in fly.toml and push again."
            exit 1
          fi

      - name: Deploy
        run: flyctl deploy --remote-only

      # flyctl provisions 2 machines by default for high availability. This is a
      # personal-scale app on a tight budget, and both machines bill per second
      # while awake, so pin the count to 1. Idempotent - a no-op once it's 1.
      - name: Pin to a single machine (cost control)
        run: flyctl scale count 1 --yes
